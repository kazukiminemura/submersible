<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ABYSSAL SCOUT</title>
  </head>
  <body>
    <main id="app">
      <canvas id="scene" aria-label="深海探索ゲーム"></canvas>
      <section class="hud" aria-live="polite">
        <div class="brand"><span class="brand-dot"></span><div><b>ABYSSAL SCOUT</b><small>深海探査艇オペレーション</small></div></div>
        <div class="readouts"><div><small>DEPTH</small><b id="depth">0 m</b></div><div><small>ENERGY</small><b id="energy">100%</b></div><div><small>SAMPLES</small><b id="samples">0 / 5</b></div></div>
        <div id="message" class="message">音響スキャンを開始。青いビーコンを探してください。</div>
        <div class="controls"><b>操縦</b><span>WASD / 矢印：移動</span><span>Space / Shift：浮上・潜航</span><span>E：サンプルを回収</span></div>
      </section>
      <section id="start" class="start-screen"><div class="panel"><p>OCEAN EXPLORATION SIMULATOR</p><h1>深海へ、潜る。</h1><span>未知の海底を航行し、散らばった5つの生体サンプルを回収しましょう。</span><button id="launch">探査を開始</button></div></section>
      <section id="complete" class="complete hidden"><div class="panel"><p>MISSION COMPLETE</p><h1>全サンプルを回収</h1><span>海洋研究基地へデータを送信しました。</span><button id="restart">もう一度潜る</button></div></section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
